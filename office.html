<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meow Cha HQ — ทีมพ่อบ้าน</title>
<style>
  :root{
    --bg:#f6f1e9;
    --surface:#ffffff;
    --ink:#2b1d14;
    --ink-muted:#7a6a5a;
    --border:#e6dcc9;
    --accent:#b5502f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,'Noto Sans Thai','Segoe UI',sans-serif;
    min-height:100vh;
  }
  header{
    text-align:center;
    padding:48px 20px 28px;
  }
  header h1{
    font-size:30px; margin:0 0 6px; font-weight:800;
  }
  header h1 span{color:var(--accent);}
  header p{color:var(--ink-muted); margin:0; font-size:14.5px;}

  .floor{
    max-width:1040px; margin:0 auto; padding:10px 20px 70px;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:18px;
  }
  .desk{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:22px 18px 20px; text-align:center; position:relative; cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .desk:hover{ transform:translateY(-4px); box-shadow:0 10px 24px rgba(43,29,20,.08); }
  .desk.lead{ border-color:var(--accent); background:linear-gradient(180deg,#fff,#fdf6f2); }

  .avatar{
    width:72px; height:72px; border-radius:50%; margin:0 auto 12px;
    display:flex; align-items:center; justify-content:center; font-size:32px;
    background:var(--bg); border:2px solid var(--border);
    animation:bob 3.2s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }
  .desk:nth-child(2) .avatar{ animation-delay:.3s; }
  .desk:nth-child(3) .avatar{ animation-delay:.6s; }
  .desk:nth-child(4) .avatar{ animation-delay:.9s; }
  .desk:nth-child(5) .avatar{ animation-delay:1.2s; }
  .desk:nth-child(6) .avatar{ animation-delay:1.5s; }
  .desk:nth-child(7) .avatar{ animation-delay:1.8s; }

  .name{ font-weight:800; font-size:15.5px; margin-bottom:2px; }
  .title{ font-size:12.5px; color:var(--accent); font-weight:700; margin-bottom:10px; }
  .status{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-muted);
    background:var(--bg); border-radius:999px; padding:3px 10px; margin-bottom:12px;
  }
  .status i{ width:7px; height:7px; border-radius:50%; background:#3f7d4f; display:inline-block; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .bubble{
    font-size:12.5px; color:var(--ink-muted); line-height:1.5; min-height:38px;
    border-top:1px dashed var(--border); padding-top:10px; display:none;
  }
  .desk.open .bubble{ display:block; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }

  footer{
    text-align:center; padding:24px 20px 50px; color:var(--ink-muted); font-size:12px;
  }
  @media (prefers-reduced-motion: reduce){
    .avatar{ animation:none; }
    .status i{ animation:none; }
  }
</style>
</head>
<body>

<header>
  <h1>🐾 Meow Cha <span>HQ</span></h1>
  <p>ออฟฟิศของพ่อบ้าน — กดที่โต๊ะใครก็ได้เพื่อดูว่าเขาทำอะไร</p>
</header>

<div class="floor" id="floor"></div>

<footer>
  หน้านี้เป็นภาพรวมทีมเฉยๆ ไม่ใช่แชท AI สด — คุยงานจริงกับทีมได้ในแชท Telegram กับพ่อบ้านตามปกติ
</footer>

<script>
const TEAM = [
  { emoji:'🤵', name:'พ่อบ้าน', title:'หัวหน้าทีม · ดูแลบอสโดยตรง', lead:true,
    line:'สวัสดีครับบอส ผมดูแลภาพรวมทุกงาน แล้วส่งต่อให้คนที่เหมาะกับงานนั้นๆ ในทีมครับ' },
  { emoji:'🔍', name:'นักวิจัย', title:'Researcher',
    line:'ก่อนลงมือทำอะไรเสี่ยงๆ ผมเช็คให้ก่อนครับ เช่น "วิธีนี้จะมีปัญหาอะไรไหม" กันพลาดไว้ก่อน' },
  { emoji:'🛡️', name:'ผู้ตรวจงาน', title:'Code Reviewer / QA',
    line:'งานไหนที่พ่อบ้านทำเสร็จ ผมช่วยตรวจทานก่อนส่งให้บอส จับบั๊ก/จุดเสี่ยงไว้ก่อนที่บอสจะเจอเอง' },
  { emoji:'📊', name:'นักวิเคราะห์ตัวเลข', title:'Data Analyst (Meow Cha)',
    line:'ดูแลต้นทุน กำไร ยอดขายของร้าน คอยเตือนถ้าเมนูไหนเริ่มขาดทุนครับ' },
  { emoji:'🎨', name:'ดีไซน์เนอร์', title:'Designer',
    line:'เรื่องสวยๆ อ่านง่ายๆ ยกให้ผมครับ ไม่ปนกับงาน logic เพื่อให้แต่ละงานโฟกัสเต็มที่' },
  { emoji:'⏰', name:'เลขาฯส่วนตัว', title:'Scheduler',
    line:'ดูแลตารางเวลาประจำวันของบอส ถามว่า "ตอนนี้ต้องทำอะไร" ผมตอบได้ทันทีครับ' },
  { emoji:'🧪', name:'นักทดลอง', title:'Spike / Prototype Tester',
    line:'อยากลองของใหม่ก่อนใช้จริง ให้ผมลองหลายๆทางให้ก่อน แล้วบอกว่าทางไหนดีที่สุดครับ' },
];

const floor = document.getElementById('floor');
floor.innerHTML = TEAM.map((p, i) => `
  <div class="desk ${p.lead?'lead':''}" data-i="${i}">
    <div class="avatar">${p.emoji}</div>
    <div class="name">${p.name}</div>
    <div class="title">${p.title}</div>
    <div class="status"><i></i> ว่าง / พร้อมรับงาน</div>
    <div class="bubble">${p.line}</div>
  </div>
`).join('');

floor.querySelectorAll('.desk').forEach(d => {
  d.addEventListener('click', () => d.classList.toggle('open'));
});
</script>
</body>
</html>
