<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meow Cha HQ — Pixel Office</title>
<style>
  :root{
    --floor-a:#e8c89a; --floor-b:#dcb986;
    --wall:#4a3a6b; --wall-trim:#332850;
    --desk:#8a5a3a; --desk-top:#a06b45;
    --screen:#3a5a6a; --screen-glow:#6fb3c9;
    --ink:#2b1d14; --paper:#fff8ec; --accent:#b5502f; --gold:#e8a84a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:#1d1510; color:var(--ink);
    font-family:-apple-system,'Noto Sans Thai','Segoe UI',sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:16px 10px 40px;
  }
  h1{ color:#fff8ec; font-size:20px; margin:4px 0 2px; text-align:center; }
  h1 span{ color:var(--gold); }
  p.sub{ color:#cdb9a3; font-size:12.5px; margin:0 0 10px; text-align:center; }

  .controls{ margin-bottom:12px; }
  .assign-btn{
    background:var(--accent); color:#fff8ec; border:none; border-radius:999px;
    padding:9px 18px; font-size:13px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 0 #7a3016; transition:transform .08s;
  }
  .assign-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #7a3016; }

  .room-wrap{
    width:100%; max-width:960px; aspect-ratio:16/10.5;
    position:relative; border-radius:10px;
    box-shadow:0 14px 40px rgba(0,0,0,.45);
  }
  .room-bg{ position:absolute; inset:0; border-radius:10px; overflow:hidden; z-index:0; }
  .wall{
    position:absolute; top:0; left:0; right:0; height:13%;
    background:repeating-linear-gradient(90deg, var(--wall) 0 28px, var(--wall-trim) 28px 30px);
    border-bottom:4px solid var(--wall-trim);
  }
  .sign{
    position:absolute; top:1.5%; left:50%; transform:translateX(-50%);
    background:var(--desk-top); border:2px solid var(--wall-trim); border-radius:6px;
    padding:3px 14px; font-size:12px; font-weight:800; color:#fff8ec; white-space:nowrap; z-index:2;
  }
  .peek{
    position:absolute; top:1%; left:6%; width:9%; aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center; font-size:20px;
    animation:peek 3.4s ease-in-out infinite; z-index:3;
  }
  @keyframes peek{
    0%,60%,100%{ transform:translateY(0); opacity:1; }
    75%{ transform:translateY(-120%); opacity:0; }
    90%{ transform:translateY(0); opacity:1; }
  }
  .floor{
    position:absolute; top:13%; left:0; right:0; bottom:0;
    background-image:
      repeating-linear-gradient(0deg, var(--floor-a) 0 40px, var(--floor-b) 40px 80px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 40px, rgba(0,0,0,0) 40px 80px);
  }
  .rug{
    position:absolute; left:50%; top:62%; width:30%; height:26%; transform:translate(-50%,-50%);
    background:#b5502f22; border:3px solid #b5502f55; border-radius:50%;
  }
  .cat{
    position:absolute; left:50%; top:62%; transform:translate(-50%,-50%); font-size:26px;
    animation:catbreathe 3s ease-in-out infinite; z-index:1;
  }
  @keyframes catbreathe{ 0%,100%{ transform:translate(-50%,-50%) scale(1);} 50%{ transform:translate(-50%,-50%) scale(1.05);} }
  .coffee-table{
    position:absolute; left:50%; top:78%; width:9%; aspect-ratio:1.6/1; transform:translateX(-50%);
    background:var(--desk); border-radius:6px; border:2px solid #0000002a; z-index:1;
  }
  .coffee-table i{ position:absolute; top:-70%; left:50%; transform:translateX(-50%); font-size:16px; }

  .workflow{
    position:absolute; left:50%; top:40%; transform:translate(-50%,-50%);
    background:var(--paper); border:2px solid var(--ink); border-radius:12px;
    padding:6px 12px; font-size:10px; font-weight:700; color:var(--accent);
    display:flex; align-items:center; gap:5px; white-space:nowrap; z-index:1;
    box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  .workflow .step{ color:var(--ink); font-weight:600; }
  .workflow .arrow{ color:#bbb; }

  /* ============ DESK + CHARACTER ============ */
  .spot{
    position:absolute; width:12%; aspect-ratio:1/1.35; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; cursor:pointer;
    user-select:none; z-index:1;
  }
  .spot.boss{ width:15%; z-index:1; }
  .nameplate{
    font-size:10px; color:#fff8ec; background:#00000066; border-radius:5px;
    padding:1px 6px; margin-bottom:3px; white-space:nowrap; font-weight:700;
  }
  .spot.boss .nameplate{ background:var(--gold); color:#3a2500; font-size:11px; }
  .crown{ position:absolute; top:-16%; left:50%; transform:translateX(-50%); font-size:16px; z-index:3; }

  .char{ position:relative; width:46%; height:40%; margin-bottom:-6%; animation:idle 2.6s ease-in-out infinite; z-index:2; }
  .char .head{ position:absolute; top:0; left:50%; width:68%; aspect-ratio:1/1; transform:translateX(-50%); border-radius:50%; border:2px solid #0000002a; }
  .char .body{ position:absolute; bottom:0; left:50%; width:85%; height:62%; transform:translateX(-50%); border-radius:40% 40% 20% 20%; border:2px solid #0000002a; }
  .char .leg{ position:absolute; bottom:-10%; width:16%; height:16%; background:#3a2a1f; border-radius:3px; }
  .char .leg.l{ left:28%; } .char .leg.r{ right:28%; }
  @keyframes idle{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-6%) rotate(-1.5deg); } }
  .spot:nth-child(3) .char{ animation-delay:.2s; } .spot:nth-child(4) .char{ animation-delay:.4s; }
  .spot:nth-child(5) .char{ animation-delay:.6s; } .spot:nth-child(6) .char{ animation-delay:.8s; }
  .spot:nth-child(7) .char{ animation-delay:1.0s; } .spot:nth-child(8) .char{ animation-delay:1.2s; }

  .desk{ width:88%; height:30%; background:var(--desk); border-radius:6px 6px 3px 3px; position:relative; z-index:1; border:2px solid #00000022; }
  .spot.boss .desk{ width:100%; height:26%; }
  .desk::before{ content:''; position:absolute; top:-6%; left:4%; right:4%; height:22%; background:var(--desk-top); border-radius:4px; }
  .monitor{ position:absolute; top:-46%; left:50%; width:36%; aspect-ratio:1/0.8; transform:translateX(-50%); background:#2e2018; border-radius:3px; border:2px solid #1a110b; z-index:1; }
  .monitor i{ position:absolute; inset:10%; background:var(--screen); border-radius:1px; box-shadow:0 0 6px var(--screen-glow); animation:flicker 2.4s ease-in-out infinite; }
  @keyframes flicker{ 0%,100%{opacity:.9;} 50%{opacity:1;} }

  .status-dot{ position:absolute; bottom:4px; right:14%; width:8px; height:8px; border-radius:50%; background:#58c76a; border:1.5px solid #fff; z-index:3; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .status-dot.busy{ background:#e8a84a; animation:pulse .6s ease-in-out infinite; }

  .bubble{
    position:absolute; bottom:108%; left:50%; transform:translateX(-50%) scale(.85);
    width:150px; background:var(--paper); border:2px solid var(--ink); border-radius:10px;
    padding:8px 10px; font-size:11px; line-height:1.45; color:var(--ink);
    opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease;
    z-index:5; text-align:left;
  }
  .bubble::after{ content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); border-width:8px 7px 0 7px; border-style:solid; border-color:var(--ink) transparent transparent transparent; }
  .bubble b{ display:block; color:var(--accent); font-size:11.5px; margin-bottom:2px; }
  .spot.open{ z-index:4; }
  .spot.open .bubble{ opacity:1; transform:translateX(-50%) scale(1); }

  /* ============ WALKER (task assignment animation) ============ */
  .walker{
    position:absolute; width:12%; aspect-ratio:1/1.35; transform:translate(-50%,-50%);
    z-index:6; transition:left 1.1s cubic-bezier(.4,0,.2,1), top 1.1s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }
  .walker .char{ animation:walk-bob .35s ease-in-out infinite; margin-bottom:0; }
  @keyframes walk-bob{ 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-10%) rotate(3deg); } }
  .walker .tag{
    position:absolute; top:-18%; left:50%; transform:translateX(-50%); font-size:16px; white-space:nowrap;
  }

  footer{ color:#cdb9a3; font-size:11.5px; text-align:center; margin-top:14px; max-width:620px; }
</style>
</head>
<body>

<h1>🐾 Meow Cha <span>HQ</span> · Pixel Office</h1>
<p class="sub">มุมมองบอส — แตะใครก็ได้เพื่อฟังเขาแนะนำตัว หรือกดปุ่มด้านล่างเพื่อมอบหมายงาน</p>

<div class="controls">
  <button class="assign-btn" id="assignBtn">📋 มอบหมายงานตัวอย่าง</button>
</div>

<div class="room-wrap" id="room">
  <div class="room-bg">
    <div class="wall"></div>
    <div class="sign">🐱 Pixel Office</div>
    <div class="peek" title="บอสแอบมอง">🫣</div>
    <div class="floor"></div>
    <div class="rug"></div>
    <div class="cat">🐈</div>
    <div class="coffee-table"><i>☕</i></div>
  </div>
  <div class="workflow" id="workflow">
    <span class="step">Research</span><span class="arrow">→</span>
    <span class="step">Build</span><span class="arrow">→</span>
    <span class="step">QA</span><span class="arrow">→</span>
    <span class="step">Ship 🚀</span>
  </div>
</div>

<footer>
  หน้านี้เป็นภาพรวมทีมแบบเกม ไม่ใช่แชท AI สด — คุยงานจริงกับทีมได้ในแชท Telegram กับพ่อบ้านตามปกติ
</footer>

<script>
const TEAM = [
  { emoji:'🤵', name:'พ่อบ้าน', title:'หัวหน้าทีม', head:'#e8b48a', body:'#2b2b2b', boss:true,
    x:50, y:26, line:'<b>พ่อบ้าน</b>สวัสดีครับบอส ผมดูแลภาพรวม แล้วส่งงานต่อให้คนที่เหมาะสมครับ' },
  { emoji:'🔍', name:'นักวิจัย', title:'Researcher', head:'#f0c9a0', body:'#3a6b8a',
    x:18, y:40, line:'<b>นักวิจัย</b>เช็คให้ก่อนว่าวิธีนี้จะมีปัญหาอะไรไหม กันพลาดไว้ก่อนครับ' },
  { emoji:'📊', name:'นักวิเคราะห์', title:'Data Analyst', head:'#eecb9f', body:'#3a6a4a',
    x:82, y:40, line:'<b>นักวิเคราะห์</b>ดูแลต้นทุน-กำไรร้าน Meow Cha คอยเตือนถ้าเมนูไหนขาดทุนครับ' },
  { emoji:'🛡️', name:'ผู้ตรวจงาน', title:'QA', head:'#e8c49a', body:'#6a3a3a',
    x:14, y:68, line:'<b>ผู้ตรวจงาน</b>ตรวจงานก่อนส่งให้บอส จับบั๊ก/จุดเสี่ยงไว้ก่อนครับ' },
  { emoji:'🎨', name:'ดีไซน์เนอร์', title:'UI/Design', head:'#f0c0b0', body:'#8a4a6a',
    x:86, y:68, line:'<b>ดีไซน์เนอร์</b>เรื่องสวยๆอ่านง่ายๆ ยกให้ผมครับ' },
  { emoji:'⏰', name:'เลขาฯ', title:'Scheduler', head:'#eccfa0', body:'#8a7a3a',
    x:30, y:88, line:'<b>เลขาฯ</b>ดูแลตารางเวลาประจำวันของบอสครับ' },
  { emoji:'🧪', name:'นักทดลอง', title:'Spike Tester', head:'#e0c9a8', body:'#4a8a7a',
    x:70, y:88, line:'<b>นักทดลอง</b>อยากลองของใหม่ก่อนใช้จริง ให้ผมทดลองหลายทางให้ก่อนครับ' },
];

const room = document.getElementById('room');
function charHTML(p){
  return `
    <div class="char">
      <div class="head" style="background:${p.head}"></div>
      <div class="body" style="background:${p.body}"></div>
      <div class="leg l"></div><div class="leg r"></div>
    </div>`;
}

TEAM.forEach((p, i) => {
  const el = document.createElement('div');
  el.className = 'spot' + (p.boss ? ' boss' : '');
  el.dataset.i = i;
  el.style.left = p.x + '%';
  el.style.top = p.y + '%';
  el.innerHTML = `
    ${p.boss ? '<div class="crown">👑</div>' : ''}
    <div class="bubble">${p.line}</div>
    <div class="nameplate">${p.emoji} ${p.name}</div>
    ${charHTML(p)}
    <div class="desk"><div class="monitor"><i></i></div></div>
    <div class="status-dot"></div>
  `;
  el.addEventListener('click', () => {
    document.querySelectorAll('.spot').forEach(s => { if(s !== el) s.classList.remove('open'); });
    el.classList.toggle('open');
  });
  room.appendChild(el);
});

/* ===== Walk-to-center animation when a task is "assigned" ===== */
function assignTask(){
  // pick a random non-boss team member
  const candidates = TEAM.map((p,i)=>i).filter(i => !TEAM[i].boss);
  const i = candidates[Math.floor(Math.random() * candidates.length)];
  const p = TEAM[i];
  const spotEl = room.querySelector(`.spot[data-i="${i}"]`);
  const dot = spotEl.querySelector('.status-dot');
  dot.classList.add('busy');
  spotEl.style.opacity = '0.25'; // character "left the desk"

  const walker = document.createElement('div');
  walker.className = 'walker';
  walker.style.left = p.x + '%';
  walker.style.top = p.y + '%';
  walker.innerHTML = `<div class="tag">📋</div>${charHTML(p)}`;
  room.appendChild(walker);

  // step 1: walk to the workflow board in the center
  // (force a reflow before changing the target so the CSS transition is
  // guaranteed to see the "before" state first, then use a timeout instead
  // of requestAnimationFrame — some headless/background browser contexts
  // throttle or skip rAF entirely when the tab isn't actively compositing)
  void walker.offsetHeight;
  setTimeout(() => {
    walker.style.left = '50%';
    walker.style.top = '40%';
  }, 20);

  setTimeout(() => {
    walker.querySelector('.tag').textContent = '✅';
    setTimeout(() => {
      // step 2: walk back to the desk
      walker.style.left = p.x + '%';
      walker.style.top = p.y + '%';
      setTimeout(() => {
        walker.remove();
        spotEl.style.opacity = '1';
        dot.classList.remove('busy');
      }, 1150);
    }, 900);
  }, 1150);
}
document.getElementById('assignBtn').addEventListener('click', assignTask);
</script>
</body>
</html>
