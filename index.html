<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meow Cha — ต้นทุน & สต็อก</title>
<style>
  :root{
    --bg:#f6f1e9;
    --surface:#ffffff;
    --surface-2:#fbf8f3;
    --ink:#2b1d14;
    --ink-muted:#7a6a5a;
    --border:#e6dcc9;
    --accent:#b5502f;
    --accent-ink:#ffffff;
    --good:#3f7d4f;
    --good-bg:#e7f2e8;
    --warn:#a9790f;
    --warn-bg:#faefd7;
    --bad:#b5402f;
    --bad-bg:#fbe7e2;
    --radius:10px;
    --mono:'SF Mono', 'Menlo', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, 'Noto Sans Thai', 'Segoe UI', sans-serif;
    font-size:14px;
    line-height:1.45;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 22px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  header h1{
    font-size:17px; margin:0; font-weight:700; white-space:nowrap;
  }
  header h1 span{color:var(--accent);}
  nav.tabs{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px;}
  nav.tabs button{
    border:none; background:transparent; padding:7px 16px; border-radius:999px;
    font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-muted);
  }
  nav.tabs button.active{background:var(--accent); color:var(--accent-ink);}
  .spacer{flex:1;}
  .toolbar{display:flex; gap:8px; align-items:center;}
  input[type=search]{
    border:1px solid var(--border); border-radius:8px; padding:7px 10px;
    font-size:13px; min-width:180px; background:var(--surface-2); color:var(--ink);
  }
  select{
    border:1px solid var(--border); border-radius:8px; padding:7px 10px;
    font-size:13px; background:var(--surface-2); color:var(--ink);
  }
  button.btn{
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    padding:7px 13px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
  }
  button.btn:hover{border-color:var(--accent); color:var(--accent);}
  button.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  main{padding:18px 22px 60px;}

  /* ===== summary strip ===== */
  .stats{display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .stat{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 18px; min-width:140px;
  }
  .stat .v{font-size:22px; font-weight:800; font-family:var(--mono);}
  .stat .l{font-size:12px; color:var(--ink-muted); margin-top:2px;}
  .stat.good .v{color:var(--good);}
  .stat.warn .v{color:var(--warn);}
  .stat.bad .v{color:var(--bad);}

  /* ===== menu table ===== */
  .cat-group{margin-bottom:22px;}
  .cat-title{font-size:13px; font-weight:700; color:var(--ink-muted); margin:0 0 8px 2px; text-transform:none;}
  table{width:100%; border-collapse:collapse; background:var(--surface); border-radius:var(--radius); overflow:hidden; border:1px solid var(--border);}
  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--radius);}
  .table-wrap table{min-width:560px;}
  thead th{
    text-align:left; font-size:11.5px; font-weight:700; color:var(--ink-muted);
    padding:9px 12px; border-bottom:1px solid var(--border); background:var(--surface-2);
    white-space:nowrap;
  }
  td{padding:9px 12px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td.num, th.num{text-align:right; font-family:var(--mono);}
  .name-cell{font-weight:600;}
  .note{font-size:11.5px; color:var(--ink-muted); font-weight:400; display:block;}
  .badge{
    display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700;
  }
  .badge.good{background:var(--good-bg); color:var(--good);}
  .badge.warn{background:var(--warn-bg); color:var(--warn);}
  .badge.bad{background:var(--bad-bg); color:var(--bad);}
  input.edit{
    width:64px; border:1px solid transparent; border-radius:6px; background:transparent;
    padding:4px 6px; font-family:var(--mono); font-size:13px; text-align:right; color:var(--ink);
  }
  input.edit:hover{border-color:var(--border);}
  input.edit:focus{border-color:var(--accent); background:var(--surface); outline:none;}

  /* bar for margin visualization */
  .bar-cell{width:90px;}
  .bar{height:6px; border-radius:3px; background:var(--border); overflow:hidden;}
  .bar i{display:block; height:100%; border-radius:3px;}

  /* ===== stock table ===== */
  .stock-section{margin-bottom:10px;}
  .pill-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .pill{
    border:1px solid var(--border); background:var(--surface); border-radius:999px;
    padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; color:var(--ink-muted);
  }
  .pill.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  footer{padding:20px 22px 40px; color:var(--ink-muted); font-size:12px;}

  /* ===== recipe editor ===== */
  .chev-btn{
    border:none; background:transparent; cursor:pointer; color:var(--ink-muted);
    font-size:12px; width:20px; height:20px; padding:0; margin-right:4px; vertical-align:middle;
  }
  .chev-btn.open{color:var(--accent);}
  tr.recipe-row{display:none; background:var(--surface-2);}
  tr.recipe-row.open{display:table-row;}
  tr.recipe-row td{padding:14px 16px;}
  .recipe-box{border:1px solid var(--border); border-radius:8px; background:var(--surface); padding:12px 14px;}
  .recipe-box table{border:none; box-shadow:none;}
  .recipe-box thead th{background:transparent; padding:4px 8px; font-size:11px;}
  .recipe-box td{padding:5px 8px; border-bottom:1px solid var(--border);}
  .recipe-box select{font-size:12.5px; padding:5px 7px; min-width:170px;}
  .recipe-box input.qty-edit{width:60px; font-size:12.5px; padding:5px 7px; border:1px solid var(--border); border-radius:6px; text-align:right;}
  .mini-btn{
    border:none; background:transparent; color:var(--bad); cursor:pointer; font-size:14px; padding:2px 6px;
  }
  .add-ing-row{display:flex; gap:6px; margin-top:8px; align-items:center;}
  .recipe-summary{
    display:flex; justify-content:space-between; align-items:center; margin-top:10px;
    padding-top:10px; border-top:1px dashed var(--border); font-size:13px;
  }
  .recipe-summary b{font-family:var(--mono); font-size:15px;}
  .sync-btn{background:var(--good); color:#fff; border:none; border-radius:7px; padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer;}
  .sync-btn:hover{opacity:.9;}
  .recipe-empty{color:var(--ink-muted); font-size:12.5px; padding:4px 0;}

  @media (max-width:720px){
    body{font-size:15px;}
    header{padding:10px 12px; gap:10px;}
    header h1{font-size:16px;}
    nav.tabs{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; flex-shrink:0;}
    nav.tabs button{padding:8px 14px; white-space:nowrap; font-size:12.5px;}
    .spacer{display:none;}
    .toolbar{width:100%; order:3; flex-wrap:wrap;}
    input[type=search]{flex:1; min-width:0;}
    main{padding:10px 10px 60px;}
    .stats{gap:8px;}
    .stat{min-width:unset; flex:1 1 44%; padding:10px 12px;}
    .stat .v{font-size:19px;}
    table{font-size:12.5px;}
    .table-wrap table{min-width:480px;}
    input.edit{min-height:30px;}
    button.btn, .sync-btn, .chev-btn{min-height:36px;}
    .recipe-box select, .recipe-box input.qty-edit{min-height:36px;}
  }
</style>
</head>
<body>

<header>
  <h1>🐾 Meow <span>Cha</span></h1>
  <nav class="tabs">
    <button data-view="menu" class="active">เมนู &amp; ต้นทุน</button>
    <button data-view="ingredients">วัตถุดิบ &amp; เบส</button>
    <button data-view="stock">สต็อกวัตถุดิบ</button>
    <button data-view="fixed">ต้นทุนคงที่ (ประมาณการ)</button>
  </nav>
  <div class="spacer"></div>
  <div class="toolbar">
    <input type="search" id="search" placeholder="ค้นหา...">
    <button class="btn" id="exportBtn">⬇ Export JSON</button>
    <button class="btn" id="resetBtn">↺ รีเซ็ตเป็นข้อมูลเดิม</button>
    <span id="syncStatus" style="font-size:12px;color:var(--ink-muted);white-space:nowrap;">●</span>
  </div>
</header>

<main>
  <div id="view-menu"></div>
  <div id="view-ingredients" style="display:none"></div>
  <div id="view-stock" style="display:none"></div>
  <div id="view-fixed" style="display:none"></div>
</main>

<footer>
  ข้อมูลต้นทุน/สต็อกดึงมาจาก Google Sheet "Meow Cha ข้อมูลร้าน" (เมื่อวันที่ดึงข้อมูล) — แก้ไขที่นี่จะบันทึกไว้ในเบราว์เซอร์นี้เท่านั้น (localStorage) ไม่ย้อนไปแก้ชีตต้นฉบับ กด Export เพื่อเอาข้อมูลไปใช้ต่อ
</footer>

const GH_TOKEN = atob(GH_TOKEN_OBF).split('').reverse().join('');
const GH_REPO = "ta1150/meowcha-dashboard";
const GH_PATH = "data.json";
const GH_API = `https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`;
let ghSha = null;        // last known file sha, for optimistic-concurrency updates
let syncTimer = null;
let syncing = false;

function b64encodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decodeUtf8(str){ return decodeURIComponent(escape(atob(str))); }

function setSyncStatus(text, color){
  const el = document.getElementById('syncStatus');
  if(el){ el.textContent = text; el.style.color = color || 'var(--ink-muted)'; }
}

async function fetchRemoteState(){
  setSyncStatus('🔄 กำลังโหลด...', 'var(--warn)');
  try{
    const res = await fetch(GH_API, {
      headers: { Authorization: `token ${GH_TOKEN}`, Accept: 'application/vnd.github+json' },
      cache: 'no-store',
    });
    if(res.status === 404){ setSyncStatus('🟡 ยังไม่มีข้อมูลกลาง', 'var(--warn)'); return null; }
    if(!res.ok){ setSyncStatus('⚠️ โหลดไม่สำเร็จ', 'var(--bad)'); return null; }
    const json = await res.json();
    ghSha = json.sha;
    const text = b64decodeUtf8(json.content.replace(/\n/g, ''));
    const data = JSON.parse(text);
    setSyncStatus('✅ ซิงก์แล้ว ' + new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}), 'var(--good)');
    return data;
  }catch(e){
    setSyncStatus('⚠️ ออฟไลน์ / โหลดไม่สำเร็จ', 'var(--bad)');
    return null;
  }
}

async function pushRemoteState(){
  if(syncing) return; // avoid overlapping pushes
  syncing = true;
  setSyncStatus('🔄 กำลังซิงก์...', 'var(--warn)');
  const payload = { menu, stock, recipes, raw, bases, pkgProfiles, fixedCosts, updatedAt: new Date().toISOString() };
  try{
    const body = { message: 'Update from dashboard', content: b64encodeUtf8(JSON.stringify(payload, null, 2)) };
    if(ghSha) body.sha = ghSha;
    const res = await fetch(GH_API, {
      method: 'PUT',
      headers: { Authorization: `token ${GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if(res.status === 409){
      // someone else (another device) pushed in between — refetch their
      // version and let the user know, rather than silently overwriting it
      setSyncStatus('⚠️ มีการแก้จากเครื่องอื่น กำลังโหลดล่าสุด...', 'var(--warn)');
      const remote = await fetchRemoteState();
      if(remote){ applyRemoteState(remote); renderAll(); }
      syncing = false;
      return;
    }
    if(!res.ok){ setSyncStatus('⚠️ ซิงก์ไม่สำเร็จ', 'var(--bad)'); syncing = false; return; }
    const json = await res.json();
    if(json.content) ghSha = json.content.sha;
    setSyncStatus('✅ ซิงก์แล้ว ' + new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}), 'var(--good)');
  }catch(e){
    setSyncStatus('⚠️ ออฟไลน์ / ซิงก์ไม่สำเร็จ (จะลองใหม่เมื่อแก้ไขครั้งถัดไป)', 'var(--bad)');
  }
  syncing = false;
}

function scheduleSync(){
  // debounce: push ~1.2s after the user stops typing/editing, not on every keystroke
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushRemoteState, 1200);
}

function applyRemoteState(data){
  if(data.menu) menu = data.menu;
  if(data.stock) stock = data.stock;
  if(data.recipes) recipes = data.recipes;
  if(data.raw) raw = data.raw;
  if(data.bases) bases = data.bases;
  if(data.pkgProfiles) pkgProfiles = data.pkgProfiles;
  if(data.fixedCosts) fixedCosts = Object.assign({}, FIXED_COSTS_SEED, data.fixedCosts);
  localStorage.setItem('meowcha_menu', JSON.stringify(menu));
  localStorage.setItem('meowcha_stock', JSON.stringify(stock));
  localStorage.setItem('meowcha_recipes', JSON.stringify(recipes));
  localStorage.setItem('meowcha_raw', JSON.stringify(raw));
  localStorage.setItem('meowcha_bases', JSON.stringify(bases));
  localStorage.setItem('meowcha_pkgProfiles', JSON.stringify(pkgProfiles));
  localStorage.setItem('meowcha_fixedCosts', JSON.stringify(fixedCosts));
}

  ensurePkgRawItems(); // remote data saved before the packaging feature won't have pkg_*/ice yet
  renderMenu(document.getElementById('search').value);
  renderIngredients(document.getElementById('search').value);
  renderStock(document.getElementById('search').value);
  renderFixed();
}

let openPkgCat = null;    // which category's packaging card is expanded (menu view)

// Existing users already have a saved `raw` list (localStorage / GitHub) from before
// the packaging feature, so RAW_SEED additions would never reach them. Append any
// missing pkg_*/ice seed entries (prices stay 0 until the user fills them in).
function ensurePkgRawItems(){
  let added = false;
  PKG_RAW_IDS.forEach(id => {
    if(raw.some(r => r.id === id)) return;
    const seed = RAW_SEED.find(r => r.id === id);
    if(seed){ raw.push(JSON.parse(JSON.stringify(seed))); added = true; }
  });
  if(added) localStorage.setItem('meowcha_raw', JSON.stringify(raw));
}
ensurePkgRawItems();

function rawById(id){ return raw.find(i => i.id === id); }
function unitCostRaw(r){
  if(!r) return 0;
  if(r.type === 'each'){
    const y = r.yieldMl || 1;
    return (r.packPrice||0) / y;
  }
  const sz = r.packSize || 1;
  const mult = (r.packUnit === 'kg' || r.packUnit === 'L') ? 1000 : 1;
  return (r.packPrice||0) / (sz * mult);
}
function rawDisplayUnit(r){
  if(r.type === 'each') return 'ชิ้น';
  return r.type === 'solid' ? 'กรัม' : 'มล.';
}
function baseUnitCost(baseId, seen){
  seen = seen || new Set();
  if(seen.has(baseId)) return 0; // guard against accidental cycles
  seen.add(baseId);
  const b = bases[baseId];
  if(!b) return 0;
  let totalCost = 0, totalQty = 0;
  b.rows.forEach(row => {
    const q = parseFloat(row.qty) || 0;
    totalCost += q * costOf(row.ing, seen);
    totalQty += q;
  });
  return totalQty ? totalCost / totalQty : 0;
}
// costOf(id): resolves cost-per-unit for ANY id — raw ingredient, base, or '' (free/water) = 0
function costOf(id, seen){
  if(!id) return 0;
  if(bases[id]) return baseUnitCost(id, seen);
  return unitCostRaw(rawById(id));
}
function unitLabel(id){
  if(!id) return '';
  if(bases[id]) return 'มล./กรัม';
  const r = rawById(id);
  return r ? rawDisplayUnit(r) : '';
}
function catalogLabel(id){
  if(!id) return '';
  if(bases[id]) return '(เบส) ' + bases[id].name;
  const r = rawById(id);
  return r ? r.label : id;
}
// full list of {id,label,unit,cost} for dropdowns — recomputed fresh every call so edits propagate
function catalogOptions(){
  const opts = raw.map(r => ({id: r.id, label: r.label, unit: rawDisplayUnit(r), cost: unitCostRaw(r)}));
  Object.keys(bases).forEach(bid => opts.push({id: bid, label: '(เบส) ' + bases[bid].name, unit: 'มล./กรัม', cost: baseUnitCost(bid)}));
  return opts;
}
function recipeFor(name){ if(!recipes[name]) recipes[name] = []; return recipes[name]; }
function recipeTotalCost(name){
  return recipeFor(name).reduce((s, row) => s + costOf(row.ing) * (parseFloat(row.qty)||0), 0);
}
// packaging cost per item sold for a menu category (0 if the category has no profile)
function pkgCostForCat(cat){
  const rows = pkgProfiles[cat];
  if(!Array.isArray(rows)) return 0;
  return rows.reduce((s, row) => s + unitCostRaw(rawById(row.ing)) * (parseFloat(row.qty)||0), 0);
}
// combined per-item cost = ingredients (from recipe) + packaging (from category profile).
// Items with no recipe rows yet (e.g. bakery) fall back to the manually entered it.cost
// as their ingredient cost, so they don't silently drop to 0.
function menuCostBreakdown(it){
  const hasRecipe = recipeFor(it.name).length > 0;
  const ing = hasRecipe ? recipeTotalCost(it.name) : (parseFloat(it.cost) || 0);
  const pkg = pkgCostForCat(it.cat);
  return {hasRecipe, ing, pkg, total: ing + pkg};
}
function pkgCategories(){
  const cats = [];
  menu.forEach(it => { if(it.cat && !cats.includes(it.cat)) cats.push(it.cat); });
  Object.keys(pkgProfiles).forEach(c => { if(!cats.includes(c)) cats.push(c); });
  return cats;
}

function recalcItem(it){
  it.cost = Math.round((it.price - it.gross) * 100) / 100; // keep relation consistent if price edited elsewhere
}

function costPct(it){ return it.price ? (menuCostBreakdown(it).total / it.price * 100) : 0; }
function marginTier(pct){
  if(pct <= TARGET_COST_PCT) return 'good';
  if(pct <= 45) return 'warn';
  return 'bad';
}
function fmt(n){ return (Math.round(n*100)/100).toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmt1(n){ return (Math.round(n*10)/10).toLocaleString('th-TH', {minimumFractionDigits:1, maximumFractionDigits:1}); }

// Full re-renders rebuild the whole table (innerHTML), which would normally
// steal focus out of the input the user is actively typing in after every
// keystroke. This wrapper remembers which field was focused (by tag + first
// class + data-* attributes) and the caret position, runs the render, then
// re-finds the equivalent element in the fresh DOM and restores focus/caret
// so typing feels continuous instead of "one digit at a time".
function withFocusPreserved(fn){
  const active = document.activeElement;
  let restore = null;
  if(active && (active.tagName === 'INPUT' || active.tagName === 'SELECT')){
    let sel;
    if(active.id){
      sel = '#' + CSS.escape(active.id);
    } else {
      const classes = (active.className || '').split(' ').filter(Boolean);
      sel = active.tagName.toLowerCase() + classes.map(c => '.' + CSS.escape(c)).join('');
      Object.keys(active.dataset||{}).forEach(k => { sel += `[data-${k}="${CSS.escape(active.dataset[k])}"]`; });
    }
    restore = {sel, start: active.selectionStart, end: active.selectionEnd};
  }
  fn();
  if(restore){
    const el = document.querySelector(restore.sel);
    if(el){
      el.focus();
      if(typeof restore.start === 'number' && typeof el.setSelectionRange === 'function'){
        try{ el.setSelectionRange(restore.start, restore.end); }catch(e){}
      }
    }
  }
}

function groupBy(arr, key){
  const out = {};
  arr.forEach(x => { (out[x[key]] = out[x[key]] || []).push(x); });
  return out;
}

/* ================= MENU VIEW ================= */
function renderMenu(filterText){
  const el = document.getElementById('view-menu');
  const q = (filterText||'').trim().toLowerCase();
  const filtered = menu.filter(it => !q || it.name.toLowerCase().includes(q) || it.cat.toLowerCase().includes(q));

  // stats
  const total = menu.length;
  const bad = menu.filter(it => marginTier(costPct(it)) === 'bad').length;
  const warn = menu.filter(it => marginTier(costPct(it)) === 'warn').length;
  const noRecipe = menu.filter(it => it.note && it.note.includes('ยังไม่มีสูตร')).length;

  let html = `<div class="stats">
    <div class="stat"><div class="v">${total}</div><div class="l">เมนูทั้งหมด</div></div>
    <div class="stat bad"><div class="v">${bad}</div><div class="l">ต้นทุนเกิน 45% (แดง)</div></div>
    <div class="stat warn"><div class="v">${warn}</div><div class="l">ต้นทุนเกินเป้า 30% (เหลือง)</div></div>
    <div class="stat"><div class="v">${noRecipe}</div><div class="l">ยังไม่มีสูตรต้นทุน</div></div>
  </div>`;

  html += renderPkgPanel();

  const groups = groupBy(filtered, 'cat');
  Object.keys(groups).forEach(cat => {
    const items = groups[cat];
    html += `<div class="cat-group"><div class="cat-title">${cat} (${items.length})</div>
    <div class="table-wrap"><table><thead><tr>
      <th></th>
      <th>เมนู</th>
      <th class="num">ราคาขาย</th>
      <th class="num">ต้นทุน</th>
      <th class="num">กำไรขั้นต้น</th>
      <th class="num">%ต้นทุน</th>
      <th class="bar-cell"></th>
      <th>สถานะ</th>
    </tr></thead><tbody>`;
    items.forEach(it => {
      const idx = menu.indexOf(it);
      const pct = costPct(it);
      const tier = marginTier(pct);
      const tierLabel = tier === 'good' ? '🟢 ดี' : tier === 'warn' ? '🟡 เกินเป้า' : '🔴 สูงเกินไป';
      const barColor = tier === 'good' ? 'var(--good)' : tier === 'warn' ? 'var(--warn)' : 'var(--bad)';
      const barWidth = Math.min(100, pct);
      const isOpen = openRecipeIdx === idx;
      const nIng = recipeFor(it.name).length;
      const bd = menuCostBreakdown(it);
      const bdTitle = `วัตถุดิบ ${fmt(bd.ing)} บาท + บรรจุภัณฑ์ ${fmt(bd.pkg)} บาท` + (bd.hasRecipe ? '' : ' (ยังไม่มีสูตร — ต้นทุนวัตถุดิบกรอกเอง)');
      html += `<tr data-idx="${idx}">
        <td><button class="chev-btn ${isOpen?'open':''}" data-toggle="${idx}" title="สูตร/ส่วนผสม">${isOpen?'▼':'▶'}</button></td>
        <td class="name-cell">${it.name}${it.note ? `<span class="note">${it.note}</span>` : ''}<span class="note">${nIng ? nIng+' ส่วนผสม' : 'ยังไม่มีสูตร — กดลูกศรเพื่อเพิ่ม'}</span></td>
        <td class="num"><input class="edit price-inp" data-idx="${idx}" type="number" step="1" value="${it.price}"></td>
        <td class="num" title="${bdTitle}"><b>${fmt(bd.total)}</b>
          <span class="note" style="white-space:nowrap;">วัตถุดิบ ${bd.hasRecipe ? fmt(bd.ing) : `<input class="edit cost-inp" data-idx="${idx}" type="number" step="0.01" value="${it.cost}" title="ยังไม่มีสูตร — กรอกต้นทุนวัตถุดิบเอง">`} บาท + บรรจุภัณฑ์ ${fmt(bd.pkg)} บาท</span></td>
        <td class="num">${fmt(it.price - bd.total)}</td>
        <td class="num">${fmt1(pct)}%</td>
        <td class="bar-cell"><div class="bar"><i style="width:${barWidth}%;background:${barColor}"></i></div></td>
        <td><span class="badge ${tier}">${tierLabel}</span></td>
      </tr>
      <tr class="recipe-row ${isOpen?'open':''}" data-recipe-for="${idx}"><td colspan="8">${isOpen ? renderRecipeBox(it, idx) : ''}</td></tr>`;
    });
    html += `</tbody></table></div></div>`;
  });

  if(filtered.length === 0) html += `<p style="color:var(--ink-muted)">ไม่พบเมนูที่ตรงกับคำค้นหา</p>`;

  el.innerHTML = html;

  el.querySelectorAll('.chev-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.toggle;
      openRecipeIdx = (openRecipeIdx === idx) ? null : idx;
      renderMenu(document.getElementById('search').value);
    });
  });
  el.querySelectorAll('.price-inp').forEach(inp => {
    inp.addEventListener('input', e => {
      const idx = +e.target.dataset.idx;
      menu[idx].price = parseFloat(e.target.value) || 0;
      save('meowcha_menu', menu);
      withFocusPreserved(() => renderMenu(document.getElementById('search').value));
    });
  });
  el.querySelectorAll('.cost-inp').forEach(inp => {
    inp.addEventListener('input', e => {
      const idx = +e.target.dataset.idx;
      menu[idx].cost = parseFloat(e.target.value) || 0;
      save('meowcha_menu', menu);
      withFocusPreserved(() => renderMenu(document.getElementById('search').value));
    });
  });
  bindRecipeBoxEvents(el);
  bindPkgPanelEvents(el);
}

/* ---- packaging profile per category (same editing pattern as recipe/base rows) ---- */
function renderPkgPanel(){
  const cats = pkgCategories();
  let html = `<div class="cat-group"><div class="cat-title">📦 บรรจุภัณฑ์มาตรฐานต่อหมวด — บวกเข้าต้นทุนทุกเมนูในหมวดนั้นอัตโนมัติ (แก้ราคาแก้ว/ฝา/หลอด/น้ำแข็ง ได้ที่แท็บ "วัตถุดิบ &amp; เบส")</div>`;
  cats.forEach((cat, ci) => {
    const rows = Array.isArray(pkgProfiles[cat]) ? pkgProfiles[cat] : [];
    const isOpen = openPkgCat === cat;
    const total = pkgCostForCat(cat);
    html += `<div class="recipe-box" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" data-pkg-toggle="${ci}">
        <div><button class="chev-btn ${isOpen?'open':''}" style="pointer-events:none;">${isOpen?'▼':'▶'}</button> <b>${cat}</b>
          <span class="note" style="display:inline;">${rows.length ? rows.length + ' รายการ' : 'ไม่มีบรรจุภัณฑ์'}</span></div>
        <div style="font-family:var(--mono);font-weight:700;">${fmt(total)} บ./ชิ้น</div>
      </div>`;
    if(isOpen){
      let rowsHtml = rows.map((r, ri) => {
        const rawOpts = raw.map(rw => `<option value="${rw.id}" ${rw.id===r.ing?'selected':''}>${rw.label} (${fmt(unitCostRaw(rw))}บ./${rawDisplayUnit(rw)})</option>`).join('');
        const rw = rawById(r.ing);
        const lineCost = unitCostRaw(rw) * (parseFloat(r.qty)||0);
        return `<tr>
          <td><select class="pk-ing" data-ci="${ci}" data-ri="${ri}">
            <option value="">— เลือกวัตถุดิบ —</option>${rawOpts}
          </select></td>
          <td><input class="qty-edit pk-qty" data-ci="${ci}" data-ri="${ri}" type="number" step="0.1" value="${r.qty}"></td>
          <td style="font-size:12px;color:var(--ink-muted)">${rw ? rawDisplayUnit(rw) : ''}</td>
          <td class="num" style="font-family:var(--mono);font-size:12.5px;">${fmt(lineCost)} บ.</td>
          <td><button class="mini-btn pk-del" data-ci="${ci}" data-ri="${ri}" title="ลบ">✕</button></td>
        </tr>`;
      }).join('');
      html += `<div class="table-wrap"><table style="margin-top:10px;"><thead><tr><th>บรรจุภัณฑ์/วัตถุดิบ</th><th>ปริมาณ</th><th>หน่วย</th><th class="num">ต้นทุน</th><th></th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="5" class="recipe-empty">ไม่มีบรรจุภัณฑ์สำหรับหมวดนี้</td></tr>`}</tbody></table></div>
        <div class="add-ing-row"><button class="btn pk-add" data-ci="${ci}" type="button">➕ เพิ่มรายการ</button></div>
        <div class="recipe-summary"><span>ต้นทุนบรรจุภัณฑ์ต่อชิ้นที่ขาย: <b>${fmt(total)}</b> บาท</span></div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

function bindPkgPanelEvents(el){
  const cats = pkgCategories();
  const rowsOf = ci => { const c = cats[ci]; if(!Array.isArray(pkgProfiles[c])) pkgProfiles[c] = []; return pkgProfiles[c]; };
  const rerender = () => renderMenu(document.getElementById('search').value);
  el.querySelectorAll('[data-pkg-toggle]').forEach(row => row.addEventListener('click', () => {
    const cat = cats[+row.dataset.pkgToggle];
    openPkgCat = (openPkgCat === cat) ? null : cat;
    rerender();
  }));
  el.querySelectorAll('.pk-ing').forEach(sel => sel.addEventListener('change', e => {
    rowsOf(+e.target.dataset.ci)[+e.target.dataset.ri].ing = e.target.value;
    save('meowcha_pkgProfiles', pkgProfiles);
    rerender();
  }));
  el.querySelectorAll('.pk-qty').forEach(inp => inp.addEventListener('input', e => {
    rowsOf(+e.target.dataset.ci)[+e.target.dataset.ri].qty = parseFloat(e.target.value) || 0;
    save('meowcha_pkgProfiles', pkgProfiles);
    withFocusPreserved(rerender);
  }));
  el.querySelectorAll('.pk-del').forEach(btn => btn.addEventListener('click', () => {
    rowsOf(+btn.dataset.ci).splice(+btn.dataset.ri, 1);
    save('meowcha_pkgProfiles', pkgProfiles);
    rerender();
  }));
  el.querySelectorAll('.pk-add').forEach(btn => btn.addEventListener('click', () => {
    rowsOf(+btn.dataset.ci).push({ing: '', qty: 1});
    save('meowcha_pkgProfiles', pkgProfiles);
    rerender();
  }));
}

/* ---- recipe editor box (ingredients + qty per menu item) ---- */
function renderRecipeBox(it, idx){
  const rows = recipeFor(it.name);
  const total = recipeTotalCost(it.name);
  const catalog = catalogOptions();
  const ingOptions = catalog.map(i => `<option value="${i.id}">${i.label} (${fmt(i.cost)}บ./${i.unit})</option>`).join('');
  let rowsHtml = rows.map((r, ri) => {
    const unit = unitLabel(r.ing);
    const lineCost = costOf(r.ing) * (parseFloat(r.qty)||0);
    return `<tr>
      <td><select class="rc-ing" data-idx="${idx}" data-ri="${ri}">
        <option value="">— เลือกวัตถุดิบ —</option>${ingOptions}
      </select></td>
      <td><input class="qty-edit rc-qty" data-idx="${idx}" data-ri="${ri}" type="number" step="0.1" value="${r.qty}"></td>
      <td style="font-size:12px;color:var(--ink-muted)">${unit}</td>
      <td class="num" style="font-family:var(--mono);font-size:12.5px;">${fmt(lineCost)} บ.</td>
      <td><button class="mini-btn rc-del" data-idx="${idx}" data-ri="${ri}" title="ลบ">✕</button></td>
    </tr>`;
  }).join('');
  if(!rows.length) rowsHtml = `<tr><td colspan="5" class="recipe-empty">ยังไม่มีส่วนผสม — กด "+ เพิ่มวัตถุดิบ" ด้านล่าง</td></tr>`;

  return `<div class="recipe-box">
    <div class="table-wrap"><table><thead><tr><th>วัตถุดิบ/เบส</th><th>ปริมาณ</th><th>หน่วย</th><th class="num">ต้นทุน</th><th></th></tr></thead>
    <tbody>${rowsHtml}</tbody></table></div>
    <div class="add-ing-row">
      <button class="btn rc-add" data-idx="${idx}" type="button">➕ เพิ่มวัตถุดิบ</button>
      <span style="font-size:11.5px;color:var(--ink-muted);">ไม่เจอที่ต้องการ? ไปเพิ่มที่แท็บ "วัตถุดิบ & เบส" แล้วย้อนมาใส่สูตรนี้</span>
    </div>
    <div class="recipe-summary">
      <span>รวมต้นทุนวัตถุดิบจากสูตร: <b>${fmt(total)}</b> บาท ${Math.abs(total - it.cost) > 0.01 ? `<span style="color:var(--warn);font-size:12px;">(ต่างจากต้นทุนที่บันทึกไว้ ${fmt(it.cost)} บ.)</span>` : ''}</span>
      <button class="sync-btn rc-sync" data-idx="${idx}" type="button">📋 ใช้ค่านี้เป็นต้นทุน</button>
    </div>
    <div class="note" style="margin-top:6px;">+ บรรจุภัณฑ์มาตรฐานหมวด ${it.cat}: ${fmt(pkgCostForCat(it.cat))} บาท → ต้นทุนรวมที่ใช้คำนวณกำไร: <b>${fmt(menuCostBreakdown(it).total)}</b> บาท</div>
  </div>`;
}

function bindRecipeBoxEvents(root){
  root.querySelectorAll('.rc-ing').forEach(sel => {
    const idx = +sel.dataset.idx, ri = +sel.dataset.ri;
    sel.value = recipeFor(menu[idx].name)[ri].ing || '';
    sel.addEventListener('change', e => {
      recipeFor(menu[idx].name)[ri].ing = e.target.value;
      save('meowcha_recipes', recipes);
      renderMenu(document.getElementById('search').value);
    });
  });
  root.querySelectorAll('.rc-qty').forEach(inp => {
    inp.addEventListener('input', e => {
      const idx = +e.target.dataset.idx, ri = +e.target.dataset.ri;
      recipeFor(menu[idx].name)[ri].qty = parseFloat(e.target.value) || 0;
      save('meowcha_recipes', recipes);
      withFocusPreserved(() => renderMenu(document.getElementById('search').value));
    });
  });
  root.querySelectorAll('.rc-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.idx, ri = +btn.dataset.ri;
      recipeFor(menu[idx].name).splice(ri, 1);
      save('meowcha_recipes', recipes);
      renderMenu(document.getElementById('search').value);
    });
  });
  root.querySelectorAll('.rc-add').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.idx;
      recipeFor(menu[idx].name).push({ing: '', qty: 0});
      save('meowcha_recipes', recipes);
      renderMenu(document.getElementById('search').value);
    });
  });
  root.querySelectorAll('.rc-sync').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.idx;
      menu[idx].cost = Math.round(recipeTotalCost(menu[idx].name) * 100) / 100;
      save('meowcha_menu', menu);
      renderMenu(document.getElementById('search').value);
    });
  });
}

/* ================= INGREDIENTS & BASES VIEW ================= */
function renderIngredients(filterText){
  const el = document.getElementById('view-ingredients');
  const q = (filterText||'').trim().toLowerCase();
  const filteredRaw = raw.filter(r => !q || r.label.toLowerCase().includes(q));
  const baseIds = Object.keys(bases).filter(bid => !q || bases[bid].name.toLowerCase().includes(q));

  const unpriced = raw.filter(r => !r.packPrice).length;

  let html = `<div class="stats">
    <div class="stat"><div class="v">${raw.length}</div><div class="l">วัตถุดิบดิบทั้งหมด</div></div>
    <div class="stat bad"><div class="v">${unpriced}</div><div class="l">ยังไม่มีราคา</div></div>
    <div class="stat"><div class="v">${Object.keys(bases).length}</div><div class="l">เบส (สูตรกลาง)</div></div>
  </div>`;

  // ---- Section 1: raw ingredients ----
  html += `<div class="cat-group">
    <div class="cat-title">💰 ราคาวัตถุดิบดิบ — แก้ราคาที่นี่ จะอัปเดตต้นทุนเมนู/เบสที่ใช้วัตถุดิบนี้ทันที</div>
    <div class="table-wrap"><table><thead><tr>
      <th>วัตถุดิบ</th><th class="num">ราคา/แพ็ก</th><th>ขนาดแพ็ก</th><th>หน่วย</th>
      <th class="num">ต้นทุน/หน่วยเล็ก</th>
    </tr></thead><tbody>`;
  filteredRaw.forEach(r => {
    const idx = raw.indexOf(r);
    const uc = unitCostRaw(r);
    const isEach = r.type === 'each';
    html += `<tr>
      <td class="name-cell"><input class="edit raw-label" style="width:220px;text-align:left;font-weight:600;" data-idx="${idx}" value="${r.label}"></td>
      <td class="num"><input class="edit raw-price" data-idx="${idx}" type="number" step="1" value="${r.packPrice}"></td>
      <td>${isEach ? '—' : `<input class="edit raw-size" style="width:56px;" data-idx="${idx}" type="number" step="1" value="${r.packSize}">`}</td>
      <td style="font-size:12.5px;color:var(--ink-muted);">
        ${isEach ? `/ ${r.yieldMl||1} ชิ้น` : (r.type === 'solid' ? (r.packUnit==='kg'?'กก.':'กรัม') : (r.packUnit==='L'?'ลิตร':'มล.'))}
      </td>
      <td class="num" style="font-family:var(--mono);">${fmt(uc)} บ./${rawDisplayUnit(r)}</td>
    </tr>`;
  });
  html += `</tbody></table></div>
    <div class="add-ing-row"><button class="btn" id="addRawBtn" type="button">➕ เพิ่มวัตถุดิบดิบใหม่</button></div>
  </div>`;

  // ---- Section 2: bases ----
  html += `<div class="cat-group"><div class="cat-title">🧪 เบส (สูตรกลาง) — ผสมจากวัตถุดิบดิบ แล้วนำไปใส่ในเมนูอีกที</div>`;
  baseIds.forEach(bid => {
    const b = bases[bid];
    const isOpen = openBaseId === bid;
    const uc = baseUnitCost(bid);
    const totalQty = b.rows.reduce((s,r)=>s+(parseFloat(r.qty)||0),0);
    html += `<div class="recipe-box" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" data-base-toggle="${bid}">
        <div><button class="chev-btn ${isOpen?'open':''}" style="pointer-events:none;">${isOpen?'▼':'▶'}</button> <b>${b.name}</b>
          <span class="note" style="display:inline;">${b.rows.length} วัตถุดิบ · ได้ ${fmt(totalQty)} มล./กรัม</span></div>
        <div style="font-family:var(--mono);font-weight:700;">${fmt(uc)} บ./หน่วย</div>
      </div>`;
    if(isOpen){
      let rowsHtml = b.rows.map((r, ri) => {
        const rawOpts = raw.map(rw => `<option value="${rw.id}" ${rw.id===r.ing?'selected':''}>${rw.label} (${fmt(unitCostRaw(rw))}บ./${rawDisplayUnit(rw)})</option>`).join('');
        const lineCost = (r.ing ? unitCostRaw(rawById(r.ing)) : 0) * (parseFloat(r.qty)||0);
        return `<tr>
          <td><select class="bs-ing" data-base="${bid}" data-ri="${ri}">
            <option value="">— น้ำ/เปล่า —</option>${rawOpts}
          </select></td>
          <td><input class="qty-edit bs-qty" data-base="${bid}" data-ri="${ri}" type="number" step="0.1" value="${r.qty}"></td>
          <td class="num" style="font-family:var(--mono);font-size:12.5px;">${fmt(lineCost)} บ.</td>
          <td><button class="mini-btn bs-del" data-base="${bid}" data-ri="${ri}" title="ลบ">✕</button></td>
        </tr>`;
      }).join('');
      html += `<div class="table-wrap"><table style="margin-top:10px;"><thead><tr><th>วัตถุดิบดิบ</th><th>ปริมาณ</th><th class="num">ต้นทุน</th><th></th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="4" class="recipe-empty">ยังไม่มีวัตถุดิบในเบสนี้</td></tr>`}</tbody></table></div>
        <div class="add-ing-row"><button class="btn bs-add" data-base="${bid}" type="button">➕ เพิ่มวัตถุดิบในเบส</button></div>
        <div class="recipe-summary"><span>รวม ${fmt(totalQty)} มล./กรัม → ต้นทุนเฉลี่ย <b>${fmt(uc)}</b> บาท/หน่วย</span></div>`;
    }
    html += `</div>`;
  });
  html += `<div class="add-ing-row"><button class="btn" id="addBaseBtn" type="button">➕ สร้างเบสใหม่</button></div></div>`;

  if(filteredRaw.length === 0 && baseIds.length === 0) html += `<p style="color:var(--ink-muted)">ไม่พบวัตถุดิบ/เบสที่ตรงกับคำค้นหา</p>`;

  el.innerHTML = html;
  bindIngredientsEvents(el);
}

function bindIngredientsEvents(el){
  el.querySelectorAll('.raw-label').forEach(inp => inp.addEventListener('input', e => {
    raw[+e.target.dataset.idx].label = e.target.value;
    save('meowcha_raw', raw);
  }));
  el.querySelectorAll('.raw-price').forEach(inp => inp.addEventListener('input', e => {
    raw[+e.target.dataset.idx].packPrice = parseFloat(e.target.value) || 0;
    save('meowcha_raw', raw);
    withFocusPreserved(() => renderIngredients(document.getElementById('search').value));
  }));
  el.querySelectorAll('.raw-size').forEach(inp => inp.addEventListener('input', e => {
    raw[+e.target.dataset.idx].packSize = parseFloat(e.target.value) || 1;
    save('meowcha_raw', raw);
    withFocusPreserved(() => renderIngredients(document.getElementById('search').value));
  }));
  const addRawBtn = document.getElementById('addRawBtn');
  if(addRawBtn) addRawBtn.addEventListener('click', () => {
    const label = prompt('ชื่อวัตถุดิบใหม่:');
    if(!label) return;
    const typeIn = (prompt('ชนิด: 1=ของเหลว(มล./ลิตร)  2=ของแห้ง(กรัม/กก.)  3=นับเป็นชิ้น', '1') || '1').trim();
    const type = typeIn === '2' ? 'solid' : typeIn === '3' ? 'each' : 'liquid';
    const packPrice = parseFloat(prompt('ราคาต่อแพ็ก (บาท):', '0')) || 0;
    const id = 'custom_' + Date.now();
    if(type === 'each'){
      const yieldMl = parseFloat(prompt('ได้กี่ชิ้นต่อแพ็ก:', '1')) || 1;
      raw.push({id, label, type, packPrice, packSize: null, packUnit: null, yieldMl});
    } else {
      const packSize = parseFloat(prompt('ขนาดแพ็ก (ตัวเลข):', '1')) || 1;
      const packUnit = prompt('หน่วย (ml/L/g/kg):', type==='liquid'?'ml':'g') || (type==='liquid'?'ml':'g');
      raw.push({id, label, type, packPrice, packSize, packUnit, yieldMl: null});
    }
    save('meowcha_raw', raw);
    renderIngredients(document.getElementById('search').value);
  });
  el.querySelectorAll('[data-base-toggle]').forEach(row => row.addEventListener('click', () => {
    const bid = row.dataset.baseToggle;
    openBaseId = (openBaseId === bid) ? null : bid;
    renderIngredients(document.getElementById('search').value);
  }));
  el.querySelectorAll('.bs-ing').forEach(sel => sel.addEventListener('change', e => {
    bases[e.target.dataset.base].rows[+e.target.dataset.ri].ing = e.target.value;
    save('meowcha_bases', bases);
    renderIngredients(document.getElementById('search').value);
    renderMenu(document.getElementById('search').value);
  }));
  el.querySelectorAll('.bs-qty').forEach(inp => inp.addEventListener('input', e => {
    bases[e.target.dataset.base].rows[+e.target.dataset.ri].qty = parseFloat(e.target.value) || 0;
    save('meowcha_bases', bases);
    withFocusPreserved(() => renderIngredients(document.getElementById('search').value));
    renderMenu(document.getElementById('search').value);
  }));
  el.querySelectorAll('.bs-del').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    bases[btn.dataset.base].rows.splice(+btn.dataset.ri, 1);
    save('meowcha_bases', bases);
    renderIngredients(document.getElementById('search').value);
    renderMenu(document.getElementById('search').value);
  }));
  el.querySelectorAll('.bs-add').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    bases[btn.dataset.base].rows.push({ing: '', qty: 0});
    save('meowcha_bases', bases);
    renderIngredients(document.getElementById('search').value);
  }));
  const addBaseBtn = document.getElementById('addBaseBtn');
  if(addBaseBtn) addBaseBtn.addEventListener('click', () => {
    const name = prompt('ชื่อเบสใหม่:');
    if(!name) return;
    const id = 'base_' + Date.now();
    bases[id] = {name, rows: []};
    openBaseId = id;
    save('meowcha_bases', bases);
    renderIngredients(document.getElementById('search').value);
  });
}

/* ================= STOCK VIEW ================= */
let stockFilter = 'all';
function stockStatus(it){
  if(it.qty <= 0 && it.reorder <= 0) return 'ยังไม่ได้นับ';
  if(it.qty <= 0) return 'หมด';
  if(it.qty <= it.reorder) return 'ใกล้หมด';
  return 'พอใช้';
}
function renderStock(filterText){
  const el = document.getElementById('view-stock');
  const q = (filterText||'').trim().toLowerCase();
  let filtered = stock.filter(it => !q || it.name.toLowerCase().includes(q) || it.group.toLowerCase().includes(q));

  const notCounted = stock.filter(it => stockStatus(it) === 'ยังไม่ได้นับ').length;
  const low = stock.filter(it => stockStatus(it) === 'ใกล้หมด').length;
  const out = stock.filter(it => stockStatus(it) === 'หมด').length;

  if(stockFilter !== 'all'){
    filtered = filtered.filter(it => stockStatus(it) === stockFilter);
  }

  let html = `<div class="stats">
    <div class="stat"><div class="v">${stock.length}</div><div class="l">วัตถุดิบทั้งหมด</div></div>
    <div class="stat bad"><div class="v">${notCounted}</div><div class="l">ยังไม่เคยนับสต็อก</div></div>
    <div class="stat warn"><div class="v">${low}</div><div class="l">ใกล้หมด</div></div>
    <div class="stat bad"><div class="v">${out}</div><div class="l">หมดแล้ว</div></div>
  </div>`;

  html += `<div class="pill-row">
    ${['all','ยังไม่ได้นับ','พอใช้','ใกล้หมด','หมด'].map(s =>
      `<div class="pill ${stockFilter===s?'active':''}" data-s="${s}">${s==='all' ? 'ทั้งหมด' : s}</div>`
    ).join('')}
  </div>`;

  const groups = groupBy(filtered, 'group');
  Object.keys(groups).forEach(g => {
    const items = groups[g];
    html += `<div class="stock-section cat-group"><div class="cat-title">${g} (${items.length})</div>
    <div class="table-wrap"><table><thead><tr>
      <th>วัตถุดิบ</th>
      <th>หน่วย</th>
      <th class="num">คงเหลือ</th>
      <th class="num">จุดสั่งซื้อ</th>
      <th>สถานะ</th>
    </tr></thead><tbody>`;
    items.forEach(it => {
      const idx = stock.indexOf(it);
      const st = stockStatus(it);
      const tier = st === 'พอใช้' ? 'good' : st === 'ใกล้หมด' ? 'warn' : st === 'หมด' ? 'bad' : '';
      html += `<tr>
        <td class="name-cell">${it.name}${it.usedIn ? `<span class="note">ใช้ใน: ${it.usedIn}</span>` : ''}</td>
        <td>${it.unit}</td>
        <td class="num"><input class="edit qty-inp" data-idx="${idx}" type="number" step="1" value="${it.qty}"></td>
        <td class="num"><input class="edit reorder-inp" data-idx="${idx}" type="number" step="1" value="${it.reorder}"></td>
        <td><span class="badge ${tier || 'warn'}">${st}</span></td>
      </tr>`;
    });
    html += `</tbody></table></div></div>`;
  });

  if(filtered.length === 0) html += `<p style="color:var(--ink-muted)">ไม่พบวัตถุดิบที่ตรงกับคำค้นหา/ตัวกรอง</p>`;

  el.innerHTML = html;

  el.querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => { stockFilter = p.dataset.s; renderStock(document.getElementById('search').value); });
  });
  el.querySelectorAll('.qty-inp').forEach(inp => {
    inp.addEventListener('input', e => {
      const idx = +e.target.dataset.idx;
      stock[idx].qty = parseFloat(e.target.value) || 0;
      save('meowcha_stock', stock);
      withFocusPreserved(() => renderStock(document.getElementById('search').value));
    });
  });
  el.querySelectorAll('.reorder-inp').forEach(inp => {
    inp.addEventListener('input', e => {
      const idx = +e.target.dataset.idx;
      stock[idx].reorder = parseFloat(e.target.value) || 0;
      save('meowcha_stock', stock);
      withFocusPreserved(() => renderStock(document.getElementById('search').value));
    });
  });
}

/* ================= FIXED COST ESTIMATOR VIEW ================= */
function renderFixed(){
  const el = document.getElementById('view-fixed');
  const volume = parseFloat(fixedCosts.salesPerMonth) || 0;
  const totalFixed = FIXED_COST_FIELDS.filter(f => !f.isVolume).reduce((s, f) => s + (parseFloat(fixedCosts[f.key]) || 0), 0);
  const perUnit = volume > 0 ? fmt(totalFixed / volume) : '-';

  let html = `<div class="recipe-box" style="margin-bottom:14px;background:var(--warn-bg);border-color:var(--warn);color:var(--ink);font-size:13px;">
    ⚠️ เป็นการประมาณการเบื้องต้น ยังไม่รวมเข้ากับต้นทุนต่อเมนูโดยอัตโนมัติ — ใช้เป็นตัวเลขอ้างอิงประกอบการตัดสินใจราคา
  </div>`;

  html += `<div class="cat-group"><div class="cat-title">🧾 ต้นทุนคงที่ต่อเดือน (ประมาณการ)</div>
    <div class="recipe-box"><div class="table-wrap"><table><thead><tr><th>รายการ</th><th class="num">จำนวน</th><th>หน่วย</th></tr></thead><tbody>`;
  FIXED_COST_FIELDS.forEach(f => {
    html += `<tr>
      <td class="name-cell">${f.label}</td>
      <td class="num"><input class="qty-edit fx-inp" style="width:110px;" data-key="${f.key}" type="number" step="1" min="0" value="${fixedCosts[f.key] || 0}"></td>
      <td style="font-size:12px;color:var(--ink-muted)">${f.unit}</td>
    </tr>`;
  });
  html += `</tbody></table></div>
    <div class="recipe-summary"><span>รวมค่าใช้จ่ายคงที่/เดือน: <b>${fmt(totalFixed)}</b> บาท</span></div>
    <div class="recipe-summary"><span>ต้นทุนคงที่โดยประมาณต่อแก้ว/จาน: <b>${perUnit}</b>${volume > 0 ? ' บาท' : ' <span class="note" style="display:inline;">(กรอกยอดขายเฉลี่ยต่อเดือนก่อน)</span>'}</span></div>
    </div></div>`;

  html += `<div class="stats">
    <div class="stat"><div class="v">${fmt(totalFixed)}</div><div class="l">ค่าใช้จ่ายคงที่/เดือน (บาท)</div></div>
    <div class="stat"><div class="v">${volume.toLocaleString('th-TH')}</div><div class="l">ยอดขายเฉลี่ย/เดือน (แก้ว/จาน)</div></div>
    <div class="stat warn"><div class="v">${perUnit}</div><div class="l">ต้นทุนคงที่ต่อแก้ว/จาน (บาท, ประมาณ)</div></div>
  </div>`;

  el.innerHTML = html;
  el.querySelectorAll('.fx-inp').forEach(inp => inp.addEventListener('input', e => {
    fixedCosts[e.target.dataset.key] = parseFloat(e.target.value) || 0;
    save('meowcha_fixedCosts', fixedCosts);
    withFocusPreserved(renderFixed);
  }));
}

/* ================= NAV / GLOBAL ================= */
let currentView = 'menu';
function switchView(v){
  currentView = v;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  document.getElementById('view-menu').style.display = v === 'menu' ? '' : 'none';
  document.getElementById('view-ingredients').style.display = v === 'ingredients' ? '' : 'none';
  document.getElementById('view-stock').style.display = v === 'stock' ? '' : 'none';
  document.getElementById('view-fixed').style.display = v === 'fixed' ? '' : 'none';
  // menu cost now depends directly on raw prices (packaging/ice) edited in another tab
  if(v === 'menu') renderMenu(document.getElementById('search').value);
}
document.querySelectorAll('nav.tabs button').forEach(b => {
  b.addEventListener('click', () => switchView(b.dataset.view));
});
document.getElementById('search').addEventListener('input', e => {
  withFocusPreserved(() => {
    renderMenu(e.target.value);
    renderIngredients(e.target.value);
    renderStock(e.target.value);
  });
});
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({menu, stock, recipes, raw, bases, pkgProfiles, fixedCosts}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'meowcha_data_export.json';
  a.click();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if(!confirm('รีเซ็ตข้อมูลทั้งหมดกลับเป็นค่าเดิมที่ดึงจากชีต? (การแก้ไขที่ทำในเว็บนี้ และที่ซิงก์ไว้จะหายไป)')) return;
  menu = JSON.parse(JSON.stringify(MENU_SEED));
  stock = JSON.parse(JSON.stringify(STOCK_SEED));
  recipes = JSON.parse(JSON.stringify(RECIPES_SEED));
  raw = JSON.parse(JSON.stringify(RAW_SEED));
  bases = JSON.parse(JSON.stringify(BASES_SEED));
  pkgProfiles = JSON.parse(JSON.stringify(PKG_PROFILES_SEED));
  fixedCosts = JSON.parse(JSON.stringify(FIXED_COSTS_SEED));
  openRecipeIdx = null; openBaseId = null; openPkgCat = null;
  localStorage.setItem('meowcha_menu', JSON.stringify(menu));
  localStorage.setItem('meowcha_stock', JSON.stringify(stock));
  localStorage.setItem('meowcha_recipes', JSON.stringify(recipes));
  localStorage.setItem('meowcha_raw', JSON.stringify(raw));
  localStorage.setItem('meowcha_bases', JSON.stringify(bases));
  localStorage.setItem('meowcha_pkgProfiles', JSON.stringify(pkgProfiles));
  localStorage.setItem('meowcha_fixedCosts', JSON.stringify(fixedCosts));
  renderAll();
  scheduleSync();
});
document.getElementById('syncStatus').title = 'คลิกเพื่อซิงก์ตอนนี้เลย';
document.getElementById('syncStatus').style.cursor = 'pointer';
document.getElementById('syncStatus').addEventListener('click', () => { clearTimeout(syncTimer); pushRemoteState(); });

renderMenu('');
renderIngredients('');
renderStock('');
renderFixed();

// On load: pull the shared state from GitHub so every device starts in
// sync. If it fails (offline, token issue, etc.) we just keep whatever
// was already in localStorage and let the user keep working locally.
(async () => {
  const remote = await fetchRemoteState();
  if(remote){ applyRemoteState(remote); renderAll(); }
})();
</script>
</body>
</html>
